# NGINX location block(s) routing https://comp370.soc.ufv.ca/projects/deepseek-harness/
# to the `deepseek-harness` container on the shared `comp370` Docker network.
# Include this file from the server{} block that already terminates TLS for
# comp370.soc.ufv.ca in the portal's NGINX config.
#
# READ deploy/README.md "Subpath compatibility" before wiring this in. Short
# version: apps/web (built by Vite, served by packages/host/frontend-static)
# and the /api transport (packages/client/connection/src/api-path.ts) address
# every asset and API/WebSocket call as an ABSOLUTE path from the origin root
# (`/assets/...`, `/api/...`, `/manifest.webmanifest`, `/favicon.svg`) — none
# of it is aware of a deployment prefix. That is a real, disclosed limitation
# of the current application, not an oversight in this config; see the
# "Known limitations" section of deploy/README.md and the proposed Agent Note
# it links for the follow-up base-path feature.
#
# The locations below therefore do two things:
#   1. /projects/deepseek-harness/ serves the SPA shell itself (prefix-stripped).
#   2. The app's fixed root-relative paths (/api/, /assets/, /manifest.webmanifest,
#      /favicon.svg) are ALSO claimed at the shared domain root and proxied to
#      the same upstream. This only works if no OTHER project behind this same
#      NGINX also claims those exact path segments — confirm that with whoever
#      owns the landing page and the other `/projects/*` entries before
#      enabling this file. If there is a collision, the safe fallback is a
#      dedicated subdomain for this app instead of a shared-root path prefix.

upstream deepseek_harness {
  # Docker's embedded DNS resolves the service name on the comp370 network;
  # no host port, no host IP — never localhost/127.0.0.1/host.docker.internal.
  server deepseek-harness:3080;
}

# WebSocket upgrade only when the client actually asks for it (MUX_EVENTS_PATH /
# HOST_EVENTS_PATH under /api); every other request keeps Connection: close/keep-alive.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

location /projects/deepseek-harness/ {
  proxy_pass http://deepseek_harness/;    # trailing slash: strips the /projects/deepseek-harness prefix

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  # Long-lived streaming (LLM token streaming, SSE-style event frames): do not
  # buffer the response and give idle connections room before NGINX times out.
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# The app's fixed-path surfaces, claimed at the shared root (see the header
# comment). Order matters: NGINX picks the longest matching prefix, so these
# never shadow another project's own /assets or /api unless that project also
# proxies the exact same segment — the collision this file's header warns about.
location /api/ {
  proxy_pass http://deepseek_harness/api/;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

location /assets/ {
  proxy_pass http://deepseek_harness/assets/;
  proxy_set_header Host $host;
}

location = /manifest.webmanifest {
  proxy_pass http://deepseek_harness/manifest.webmanifest;
  proxy_set_header Host $host;
}

location = /favicon.svg {
  proxy_pass http://deepseek_harness/favicon.svg;
  proxy_set_header Host $host;
}
